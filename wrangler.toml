# Configuração do Cloudflare Pages para o AlexDesign Studio
# URL de destino: https://www.alexdesign.art.br/design
#
# Build e deploy via Wrangler CLI:
#   npm run build
#   npx wrangler pages deploy dist --project-name=alexdesign-design
#
# Ou conectando o repositório no Cloudflare Pages:
#   Build command: npm run build
#   Build output directory: dist

name = "alexdesign-design"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"
