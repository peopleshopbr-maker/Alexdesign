# Configuração do Cloudflare Pages para o AlexDesign Studio
# URL de produção: https://www.alexdesign.art.br/  (branch = main)
#
# Build e deploy manual via Wrangler CLI (direto para produção):
#   npm run build
#   npx wrangler pages deploy        <- lê projeto/branch deste arquivo

name = "alexdesign-design"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"
production_branch = "main"

[vars]
BUN_VERSION = "latest"
NODE_VERSION = "22"
