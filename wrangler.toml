# Configuração do Cloudflare Pages para o AlexDesign Studio
# URL de destino: https://www.alexdesign.art.br/design
#
# Build e deploy manual via Wrangler CLI (direto para produção):
#   npm run build
#   npx wrangler pages deploy dist --project-name=alexdesign-design --branch=production

name = "alexdesign-design"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[vars]
BUN_VERSION = "latest"
NODE_VERSION = "22"
